name: Refresh Stocks SEC Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stocks-sec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.SEC_USER_AGENT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build SEC official evidence artifact
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/build-stocks-sec.py

      - name: Commit updated evidence when changed
        run: |
          if git diff --quiet -- data/stocks-intelligence.json; then
            echo "No SEC evidence changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks-intelligence.json
          git commit -m "data: refresh SEC stocks evidence"
          git push
