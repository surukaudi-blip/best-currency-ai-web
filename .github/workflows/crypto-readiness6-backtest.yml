name: Run Crypto 6-Check Trend Qualification Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-readiness6-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 6-check trend qualification diagnostic
        run: python scripts/build-crypto-backtest-readiness6.py
      - name: Commit diagnostic artifact when changed
        run: |
          if [ -z "$(git status --porcelain -- data/crypto-backtest-readiness6.json)" ]; then
            echo "No 6-check diagnostic changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-backtest-readiness6.json
          git commit -m "data: run Crypto 6-check trend qualification diagnostic"
          git push
