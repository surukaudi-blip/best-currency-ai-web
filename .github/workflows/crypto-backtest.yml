name: Run Crypto Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stage 11C.4 historical backtest
        run: python scripts/build-crypto-backtest.py

      - name: Commit aggregated backtest diagnostics when changed
        run: |
          if git diff --quiet -- data/crypto-backtest.json; then
            echo "No Crypto backtest changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-backtest.json
          git commit -m "data: run crypto Stage 11C.4 historical backtest"
          git push
