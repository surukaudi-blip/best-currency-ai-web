name: Refresh Stocks Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: '35 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stocks-market-refresh
  cancel-in-progress: false

env:
  ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check market-data credential
        id: credential
        shell: bash
        run: |
          if [ -z "$ALPHA_VANTAGE_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ALPHA_VANTAGE_API_KEY is not configured; market refresh is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build daily stocks market-data artifact
        if: steps.credential.outputs.configured == 'true'
        run: python scripts/build-stocks-market.py

      - name: Commit updated market data when changed
        if: steps.credential.outputs.configured == 'true'
        run: |
          if git diff --quiet -- data/stocks-market-data.json; then
            echo "No stocks market-data changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks-market-data.json
          git commit -m "data: refresh stocks daily market data"
          git push
