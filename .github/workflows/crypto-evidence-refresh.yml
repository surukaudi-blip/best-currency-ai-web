name: Refresh Crypto Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

concurrency:
  group: crypto-evidence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stage 11B Crypto Evidence
        run: python scripts/build-crypto-evidence.py

      - name: Commit Crypto evidence when changed
        run: |
          if git diff --quiet -- data/crypto-evidence.json; then
            echo "No Crypto evidence changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-evidence.json
          git commit -m "data: refresh crypto protocol regulatory and network evidence"
          git push
