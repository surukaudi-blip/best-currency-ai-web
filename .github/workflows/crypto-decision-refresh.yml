name: Refresh Crypto Decision Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * *'

permissions:
  contents: write

concurrency:
  group: crypto-decision-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Stage 11C v0.4.1 regime-aware Actionability
        run: python scripts/build-crypto-decision-v041.py
      - name: Commit Crypto decision intelligence when changed
        run: |
          if [ -z "$(git status --porcelain -- data/crypto-decision-intelligence.json)" ]; then
            echo "No Crypto decision-intelligence changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-decision-intelligence.json
          git commit -m "data: refresh crypto v0.4.1 regime-aware Actionability"
          git push
