name: Run Crypto v0.4.1 Actionability Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-v041-actionability-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Stage 11C v0.4.1 diagnostic with production rounding parity
        run: python scripts/build-crypto-backtest-v041-safe.py
      - name: Commit aggregated v0.4.1 diagnostic when changed
        run: |
          if [ -z "$(git status --porcelain -- data/crypto-backtest-v041.json)" ]; then
            echo "No Crypto v0.4.1 diagnostic changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-backtest-v041.json
          git commit -m "data: run crypto v0.4.1 Actionability diagnostic"
          git push
