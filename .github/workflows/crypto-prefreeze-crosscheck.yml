name: Run Crypto 11C.5 Pre-Freeze Cross-Check

on:
  push:
    branches:
      - agent/crypto-11c5-prefreeze-crosscheck
    paths:
      - scripts/run-crypto-prefreeze-crosscheck.py
      - .github/workflows/crypto-prefreeze-crosscheck.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-11c5-prefreeze-crosscheck
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run final 11C.5 cross-check
        run: python scripts/run-crypto-prefreeze-crosscheck.py
      - name: Commit QA artifact when changed
        run: |
          if [ -z "$(git status --porcelain -- data/crypto-prefreeze-crosscheck.json)" ]; then
            echo "No QA artifact changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-prefreeze-crosscheck.json
          git commit -m "data: record Crypto 11C.5 pre-freeze cross-check"
          git push
