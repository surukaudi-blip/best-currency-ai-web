name: Stage 6 Platform Integration

on:
  push:
    branches:
      - agent/platform-integration-v1

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/platform-integration-v1
          fetch-depth: 0
      - name: Inject shared platform shell
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [
              'index.html',
              'strength.html',
              'intelligence.html',
              'decision-watch.html',
              'timeline.html',
              'validation.html',
          ]
          tag = '<script src="platform-shell.js?v=20260819-stage6"></script>'
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  if '</body>' not in text:
                      raise RuntimeError(f'{name}: missing closing body tag')
                  text = text.replace('</body>', tag + '\n</body>', 1)
                  path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/stage6-integration.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit integrated workspaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes required"
          else
            git commit -m "Integrate shared platform shell across workspaces"
            git push origin HEAD:agent/platform-integration-v1
          fi
