name: Refresh Stocks Decision Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '10 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stocks-decision-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Stocks decision-intelligence artifact
        run: python scripts/build-stocks-decision.py

      - name: Commit updated decision intelligence when changed
        run: |
          if git diff --quiet -- data/stocks-decision-intelligence.json; then
            echo "No Stocks decision-intelligence changes."
            exit 0
          fi
          git config user.name "best-currency-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocks-decision-intelligence.json
          git commit -m "data: refresh stocks decision intelligence"
          git push
