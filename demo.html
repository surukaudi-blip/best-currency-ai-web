<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Demo Mode — Best Currency AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--panel:#0d1420;--line:rgba(148,163,184,.16);--line2:rgba(148,163,184,.28);--text:#e7ecf4;--muted:#97a5ba;--cyan:#2fd3ee;--green:#3bd69a}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.top{min-height:58px;padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(7,11,20,.97)}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--cyan),#1f7fa8);display:grid;place-items:center;color:#04121a;font-size:11px}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px}.back{color:var(--cyan);font-weight:750}.controller{padding:10px 16px 11px;border-bottom:1px solid var(--line);background:#0a101b;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:1px}.step{appearance:none;border:1px solid var(--line);border-radius:9px;background:rgba(13,20,32,.72);color:var(--muted);padding:8px 10px;font:700 11px Inter;cursor:pointer;white-space:nowrap}.step.active{color:#04121a;background:var(--cyan);border-color:transparent}.controls{display:flex;gap:7px}.btn{appearance:none;border:1px solid var(--line2);border-radius:9px;background:#0d1420;color:var(--text);padding:8px 11px;font:750 11px Inter;cursor:pointer}.btn.primary{background:var(--cyan);color:#04121a;border-color:transparent}.stage{min-height:0;display:grid;grid-template-columns:270px 1fr}.cue{border-right:1px solid var(--line);padding:16px;background:#0a101b;overflow:auto}.cue .kicker{font-size:10px;letter-spacing:.12em;color:var(--cyan);font-weight:800}.cue h1{font-size:20px;line-height:1.15;margin:8px 0}.cue p{font-size:12px;line-height:1.6;color:var(--muted);margin:0}.cueBox{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(13,20,32,.7)}.cueBox b{font-size:11px}.cueBox div{font-size:11px;line-height:1.55;color:var(--muted);margin-top:5px}.timer{margin-top:14px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.bar{height:6px;margin-top:6px;background:rgba(148,163,184,.1);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);width:0;transition:width .25s}.frameWrap{min-width:0;min-height:0;background:#050911}.frame{display:block;width:100%;height:100%;border:0;background:#070b14}@media(max-width:900px){.stage{grid-template-columns:1fr}.cue{display:none}.controller{grid-template-columns:1fr}.controls{justify-content:flex-end}.top .meta .pill:first-child{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="brand" href="index.html"><span class="mark">BC</span>Best Currency AI</a><div class="meta"><span class="pill">90-Second Guided Demo</span><span class="pill">FRESH OOS · MODEL FROZEN</span><a class="back" href="index.html">Exit Demo</a></div></div>
  <div class="controller"><div class="steps" id="steps"></div><div class="controls"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next →</button></div></div>
  <div class="stage"><aside class="cue"><div class="kicker" id="kicker">01 · OVERVIEW</div><h1 id="title">The intelligence stack</h1><p id="desc"></p><div class="cueBox"><b>Presenter cue</b><div id="cueText"></div></div><div class="timer"><span id="timeLabel">0–10 sec</span><span id="progressLabel">1 / 6</span></div><div class="bar"><span id="bar"></span></div><div class="cueBox"><b>Demo principle</b><div>Show the decision journey, not every metric. Keep emphasizing explainability, risk-awareness, frozen logic, and prospective validation.</div></div></aside><div class="frameWrap"><iframe class="frame" id="frame" title="Best Currency AI guided demo"></iframe></div></div>
</div>
<script>
(function(){
const slides=[
 {label:'Overview',file:'index.html',k:'01 · OVERVIEW',title:'One explainable FX intelligence platform',time:'0–10 sec',desc:'Start with the product promise: know what is moving currencies and what could invalidate the view.',cue:'Best Currency AI turns a raw currency-strength signal into an explainable, risk-aware decision workflow.'},
 {label:'Strength',file:'strength.html',k:'02 · DETECT',title:'Detect the canonical market signal',time:'10–25 sec',desc:'Show strongest vs weakest currencies, multi-timeframe context and the canonical ECB pair bias.',cue:'We begin with a transparent strength signal. It is an input—not a black-box trade recommendation.'},
 {label:'Intelligence',file:'intelligence.html',k:'03 · EXPLAIN',title:'Explain why the signal should or should not matter',time:'25–50 sec',desc:'Bring in macro and yield, cross-market evidence, news, risk, counter-thesis and the frozen Final Reasoner.',cue:'The system argues both sides. It exposes supporting evidence, opposing evidence, key risk and invalidation conditions.'},
 {label:'Decision Watch',file:'decision-watch.html',k:'04 · WATCH',title:'Escalate material changes, not noise',time:'50–65 sec',desc:'Show confirmed vs pending alerts, persistence, cooldown and stability controls.',cue:'Decision Watch filters noisy oscillation before escalating a change, while keeping the raw audit trail intact.'},
 {label:'Timeline',file:'timeline.html',k:'05 · TRACE',title:'Trace how the decision evolved',time:'65–77 sec',desc:'Show session-by-session changes in signal, Actionability, context, Risk and Final Reasoner.',cue:'We can explain not only the current decision, but what changed from the previous session and which layers moved with it.'},
 {label:'Validation',file:'validation.html',k:'06 · VALIDATE',title:'Validate prospectively with frozen logic',time:'77–90 sec',desc:'Finish with immutable Fresh OOS predictions, sample gates and no historical backfill.',cue:'We freeze the model, capture predictions prospectively, and delay performance claims until enough settled evidence exists.'}
];
const $=id=>document.getElementById(id);let index=Math.max(0,Math.min(slides.length-1,Number(new URLSearchParams(location.search).get('step'))||0));
$('steps').innerHTML=slides.map((s,i)=>`<button class="step" data-i="${i}">${i+1}. ${s.label}</button>`).join('');
function render(){const s=slides[index];document.querySelectorAll('.step').forEach((b,i)=>b.classList.toggle('active',i===index));$('frame').src=s.file+'?demo=1&v=20260819-stage6';$('kicker').textContent=s.k;$('title').textContent=s.title;$('desc').textContent=s.desc;$('cueText').textContent=s.cue;$('timeLabel').textContent=s.time;$('progressLabel').textContent=(index+1)+' / '+slides.length;$('bar').style.width=((index+1)/slides.length*100)+'%';$('prev').disabled=index===0;$('next').textContent=index===slides.length-1?'Restart ↻':'Next →';history.replaceState(null,'','?step='+index)}
$('steps').addEventListener('click',e=>{const b=e.target.closest('.step');if(b){index=Number(b.dataset.i);render()}});$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{index=index===slides.length-1?0:index+1;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='Escape')location.href='index.html'});render();
})();
</script>
</body>
</html>
